<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <meta name="description" content="Intelligence Anti-Bully System Alert"/>
        <title>Intelligence Anti-Bully System Alert</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="shortcut icon" href="images/favicon.ico" />
        <style>
                body {
                    --bg-soft: #fff6f1;
                    --bg-accent: #ffe9d8;
                    --card-bg: #ffffff;
                    --ink: #253046;
                    --subtle: #6b7384;
                    --line: #ebeef4;
                    --alert-border: #f79c3f;
                    --primary: #1f6feb;
                    --primary-press: #1158be;
                    --ok: #13966e;

                    margin: 0;
                    min-height: 100vh;
                    font-family: "Montserrat", "Segoe UI", sans-serif;
                    color: var(--ink);
                    background:
                        radial-gradient(circle at 10% 15%, #ffffff 0%, #fff7f0 35%, transparent 60%),
                        radial-gradient(circle at 85% 0%, #ffe0c7 0%, transparent 42%),
                        linear-gradient(160deg, var(--bg-soft), var(--bg-accent));
                    padding: 14px 12px 20px;
                }

                .phone-shell {
                    width: 100%;
                    max-width: 460px;
                    margin: 0 auto;
                }

                h1 {
                    text-align: center;
                    margin: 4px 0 12px;
                    font-size: 1.25rem;
                    letter-spacing: 0.02em;
                    font-weight: 700;
                }

                .description {
                    margin: 0 0 14px;
                    text-align: center;
                    font-size: 0.76rem;
                    font-weight: 500;
                    color: var(--subtle);
                }

                .connection-bar {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: rgba(255, 255, 255, 0.84);
                    border: 1px solid rgba(255, 255, 255, 0.8);
                    backdrop-filter: blur(10px);
                    box-shadow: 0 10px 24px rgba(20, 30, 60, 0.08);
                    border-radius: 16px;
                    padding: 11px 12px;
                    position: sticky;
                    top: 10px;
                    z-index: 10;
                    margin-bottom: 14px;
                }

                .connection-bar .status {
                    margin: 0;
                    font-size: 0.8rem;
                    font-weight: 700;
                    color: #2d4665;
                    text-align: center;
                    word-break: break-word;
                    display: flex;
                    flex-wrap: wrap;
                    gap: 8px;
                    justify-content: center;
                    align-items: center;
                }

                .status-chip {
                    display: inline-flex;
                    align-items: center;
                    gap: 6px;
                    border-radius: 999px;
                    padding: 6px 10px;
                    font-size: 0.72rem;
                    line-height: 1;
                    border: 1px solid #d6deea;
                    background: #f2f5fa;
                }

                .status-chip::before {
                    content: "";
                    width: 8px;
                    height: 8px;
                    border-radius: 50%;
                    background: #94a3b8;
                }

                .status-chip.is-online {
                    color: #0f684b;
                    border-color: #bcecd7;
                    background: #e8fbf3;
                }

                .status-chip.is-online::before {
                    background: #16a34a;
                }

                .status-chip.is-warn {
                    color: #8a5600;
                    border-color: #f7ddb1;
                    background: #fff4df;
                }

                .status-chip.is-warn::before {
                    background: #f59e0b;
                }

                .status-chip.is-offline {
                    color: #8a2b3b;
                    border-color: #f3c6ce;
                    background: #ffebef;
                }

                .status-chip.is-offline::before {
                    background: #ef4444;
                }

                .status-chip.is-unknown {
                    color: #475569;
                    border-color: #dbe1ea;
                    background: #eef2f7;
                }

                .status-chip.is-unknown::before {
                    background: #64748b;
                }

                .alerts-container {
                    display: flex;
                    flex-direction: column;
                    gap: 10px;
                    margin-top: 10px;
                    margin-bottom: 12px;
                }

                .no-alerts {
                    text-align: center;
                    color: var(--subtle);
                    font-size: 0.85rem;
                    padding: 18px 12px;
                    margin: 0;
                    border: 1px dashed #d9deea;
                    border-radius: 14px;
                    background: rgba(255, 255, 255, 0.7);
                }

                .alert-card {
                    background: var(--card-bg);
                    border: 2px solid var(--alert-border);
                    border-radius: 16px;
                    padding: 14px;
                    box-shadow: 0 12px 24px rgba(18, 25, 45, 0.1);
                    animation: slideDown 0.3s ease-out;
                }

                @keyframes slideDown {
                    from {
                        opacity: 0;
                        transform: translateY(-16px);
                    }
                    to {
                        opacity: 1;
                        transform: translateY(0);
                    }
                }

                .alert-content {
                    white-space: pre-line;
                    font-size: 0.84rem;
                    line-height: 1.55;
                    margin-bottom: 6px;
                }

                .alert-card .timestamp {
                    font-size: 0.73rem;
                    color: var(--subtle);
                    margin: 5px 0 10px;
                }

                .ack-btn {
                    width: 100%;
                    border: 0;
                    border-radius: 10px;
                    background: var(--primary);
                    color: #ffffff;
                    padding: 10px 12px;
                    margin: 0 0 8px;
                    cursor: pointer;
                    font-weight: 600;
                    font-size: 0.8rem;
                }

                .ack-btn:hover:enabled {
                    background: var(--primary-press);
                }

                .ack-btn:disabled {
                    background: #9ca3af;
                    cursor: not-allowed;
                }

                .ack-log {
                    margin: 0;
                    font-size: 0.74rem;
                    color: var(--subtle);
                }

                .ack-log.ack-sent {
                    color: var(--ok);
                    font-weight: 600;
                }

                .event-log-dropdown {
                    margin-top: 4px;
                }

                .event-log-dropdown summary {
                    list-style: none;
                    cursor: pointer;
                    user-select: none;
                    border-radius: 14px;
                    padding: 11px 13px;
                    background: rgba(255, 255, 255, 0.85);
                    border: 1px solid #e7eaf2;
                    box-shadow: 0 8px 18px rgba(18, 25, 45, 0.07);
                    font-weight: 700;
                    font-size: 0.86rem;
                }

                .event-log-dropdown summary::-webkit-details-marker {
                    display: none;
                }

                .event-log-dropdown summary::after {
                    content: "\25BE";
                    float: right;
                    transition: transform 0.2s ease;
                }

                .event-log-dropdown[open] summary::after {
                    transform: rotate(180deg);
                }

                .app-card {
                    background: #ffffff;
                    border: 1px solid var(--line);
                    border-radius: 14px;
                    box-shadow: 0 10px 20px rgba(18, 25, 45, 0.08);
                    margin-top: 8px;
                }

                .app-card-log {
                    padding: 10px;
                }

                .history-list {
                    max-height: 260px;
                    overflow-y: auto;
                    border: 1px solid #e8ebf2;
                    border-radius: 10px;
                    background: #f8fafc;
                }

                .history-empty {
                    padding: 11px;
                    color: #80889a;
                    font-size: 0.8rem;
                    margin: 0;
                }

                .history-entry {
                    padding: 9px 10px;
                    border-bottom: 1px solid #e5e7eb;
                    font-size: 0.76rem;
                    font-family: "Consolas", "Courier New", monospace;
                    word-break: break-word;
                }

                .history-entry:last-child {
                    border-bottom: none;
                }

                .history-alert {
                    background: #fff4de;
                    border-left: 3px solid #f59e0b;
                }

                .history-connection {
                    background: #e5fbf2;
                    border-left: 3px solid #10b981;
                }

                .history-acknowledgement {
                    background: #e9f2ff;
                    border-left: 3px solid #3b82f6;
                }

                .history-sent {
                    background: #f3e8ff;
                    border-left: 3px solid #a855f7;
                }

                .history-audio {
                    background: #fff7ed;
                    border-left: 3px solid #fb923c;
                }

                @media (min-width: 700px) {
                    body {
                        padding: 26px;
                    }

                    .phone-shell {
                        max-width: 560px;
                    }

                    h1 {
                        font-size: 1.45rem;
                    }

                    .alert-content {
                        font-size: 0.9rem;
                    }
                }
        </style>
</head>

<body>
<main class="phone-shell">
        <h1>Intelligence Anti-Bully System Alert</h1>
        <p class="description">Developed By Nursyafiq</p>
        <div class="connection-bar">
                <p id="status" class="status">Status: Disconnected</p>
        </div>

        <details class="event-log-dropdown">
                <summary>Event Log</summary>
                <div class="app-card app-card-log">
                        <div id="historyList" class="history-list">
                                <p class="history-empty">No events yet.</p>
                        </div>
                </div>
        </details>

        <div class="alerts-container" id="alertsContainer">
                <p class="no-alerts">No alerts yet.</p>
        </div>
</main>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="system/js/common.js?i=22"></script>
<script src="system/js/auth.js?i=26"></script>
<script src="system/js/jquery-3.7.1.min.js"></script>
<script src="system/js/capacitor.js"></script>
<script>
        const ESP32_TOPIC = "testtopic/esp32";
        const ESP32_STATUS_TOPIC = "testtopic/esp32/status";
        const ACK_TOPIC = "testtopic/acknowledgment";
        const DEFAULT_BROKER_URL = "wss://b1f897df.ala.asia-southeast1.emqxsl.com:8084/mqtt";
        const DEFAULT_MQTT_USERNAME = "syafiq";
        const DEFAULT_MQTT_PASSWORD = "syafiq";

        const statusText = document.getElementById("status");
        const historyList = document.getElementById("historyList");
        const alertsContainer = document.getElementById("alertsContainer");

        let client = null;
        let lastAlertMessage = "";
        let historyCount = 0;
        let alertCardCount = 0;
        let brokerStatus = "Disconnected";
        let esp32Status = "Unknown";
        let lastEsp32Seen = 0;
        let audioContext = null;
        let audioEnabled = false;
        let isBeeping = false;
        let audioHintShown = false;
        let unacknowledgedAlertCount = 0;
        let alarmIntervalId = null;

        const ESP32_TIMEOUT_MS = 20000;
        const ALERT_BEEP_REPEAT_MS = 200;

        function ensureAudioContext() {
            if (!window.AudioContext && !window.webkitAudioContext) {
                return null;
            }

            if (!audioContext) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContextClass();
            }

            return audioContext;
        }

        function unlockAudio() {
            const ctx = ensureAudioContext();
            if (!ctx) {
                return;
            }

            if (ctx.state === "suspended") {
                ctx.resume().catch(() => {
                    // Ignore resume errors; user can retry with another interaction.
                });
            }

            audioEnabled = true;
            audioHintShown = false;
        }

        function playSingleBeep(frequency, durationMs, volume = 0.12) {
            const ctx = ensureAudioContext();
            if (!ctx || ctx.state !== "running") {
                return;
            }

            const oscillator = ctx.createOscillator();
            const gainNode = ctx.createGain();

            oscillator.type = "triangle";
            oscillator.frequency.value = frequency;

            const startTime = ctx.currentTime;
            const endTime = startTime + durationMs / 1000;

            gainNode.gain.setValueAtTime(0.0001, startTime);
            gainNode.gain.exponentialRampToValueAtTime(volume, startTime + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, endTime);

            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);

            oscillator.start(startTime);
            oscillator.stop(endTime + 0.01);
        }

        function playAlertBeep() {
            if (isBeeping) {
                return;
            }

            if (!audioEnabled) {
                if (!audioHintShown) {
                    addHistoryEvent("audio", "Tap or click the page once to enable alert sound");
                    audioHintShown = true;
                }
                return;
            }

            const ctx = ensureAudioContext();
            if (!ctx || ctx.state !== "running") {
                return;
            }

            isBeeping = true;
            playSingleBeep(1600, 120, 0.2);

            setTimeout(() => {
                playSingleBeep(1200, 120, 0.2);
            }, 150);

            setTimeout(() => {
                playSingleBeep(820, 160, 0.2);
            }, 300);

            setTimeout(() => {
                isBeeping = false;
            }, 520);
        }

        function startAlarmLoop() {
            if (alarmIntervalId) {
                return;
            }

            playAlertBeep();
            alarmIntervalId = setInterval(() => {
                if (unacknowledgedAlertCount <= 0) {
                    stopAlarmLoop();
                    return;
                }

                playAlertBeep();
            }, ALERT_BEEP_REPEAT_MS);
        }

        function stopAlarmLoop() {
            if (!alarmIntervalId) {
                return;
            }

            clearInterval(alarmIntervalId);
            alarmIntervalId = null;
        }

        function statusClassFromValue(value) {
            const normalized = String(value || "").toLowerCase();

            if (normalized.includes("connected") || normalized === "online") {
                return "is-online";
            }

            if (normalized.includes("reconnect") || normalized.includes("connecting")) {
                return "is-warn";
            }

            if (normalized.includes("error") || normalized === "offline" || normalized === "disconnected") {
                return "is-offline";
            }

            return "is-unknown";
        }

        function renderConnectionStatus() {
            const brokerClass = statusClassFromValue(brokerStatus);
            const esp32Class = statusClassFromValue(esp32Status);

            statusText.innerHTML = `
                <span class="status-chip ${brokerClass}">Server: ${brokerStatus}</span>
                <span class="status-chip ${esp32Class}">Device: ${esp32Status}</span>
            `;
        }

        function formatEsp32Alert(message) {
            try {
                const data = JSON.parse(message);
                const lines = [];

                if (data.message) lines.push(`Message: ${data.message}`);
                if (data.transcription) lines.push(`Transcription: ${data.transcription}`);

                const analysis = data.analysis;
                if (analysis && typeof analysis === "object") {
                    if (analysis.label) lines.push(`Label: ${analysis.label}`);
                    if (typeof analysis.confidence !== "undefined") {
                        lines.push(`Confidence: ${analysis.confidence}`);
                    }
                    if (Array.isArray(analysis.reasons) && analysis.reasons.length > 0) {
                        lines.push(`Reasons: ${analysis.reasons.join(", ")}`);
                    }
                } else if (analysis) {
                    lines.push(`Analysis: ${analysis}`);
                }

                if (lines.length === 0) {
                    return `ALERT: ${message}`;
                }

                return `ALERT\n${lines.join("\n")}`;
            } catch (_err) {
                return `ALERT: ${message}`;
            }
        }

        function addAlertCard(rawMessage) {
            if (alertCardCount === 0) {
                alertsContainer.innerHTML = "";
            }

            const now = new Date();
            const cardId = `alert-${Date.now()}`;
            const card = document.createElement("div");
            card.className = "alert-card";
            card.id = cardId;

            const timeStr = now.toLocaleString();
            const contentDiv = document.createElement("div");
            contentDiv.className = "alert-content";
            contentDiv.textContent = formatEsp32Alert(rawMessage);

            const timestampDiv = document.createElement("p");
            timestampDiv.className = "timestamp";
            timestampDiv.textContent = `Received: ${timeStr}`;

            const ackBtn = document.createElement("button");
            ackBtn.className = "ack-btn";
            ackBtn.textContent = "Acknowledge Alert";
            ackBtn.onclick = () => sendAcknowledgementForCard(cardId);

            const ackLogDiv = document.createElement("p");
            ackLogDiv.className = "ack-log";
            ackLogDiv.id = `ack-log-${cardId}`;
            ackLogDiv.textContent = "";

            card.appendChild(contentDiv);
            card.appendChild(timestampDiv);
            card.appendChild(ackBtn);
            card.appendChild(ackLogDiv);

            alertsContainer.prepend(card);
            alertCardCount++;

            if (alertCardCount > 10) {
                const lastCard = alertsContainer.lastElementChild;
                if (lastCard && lastCard.classList && lastCard.classList.contains("alert-card")) {
                    lastCard.remove();
                    alertCardCount = 9;
                }
            }
        }

        function sendAcknowledgementForCard(cardId) {
            if (!client || !client.connected) {
                const ackLog = document.getElementById(`ack-log-${cardId}`);
                ackLog.textContent = "Cannot send ack: not connected to broker.";
                return;
            }

            const payload = JSON.stringify({
                acknowledged: true,
            });

            client.publish(ACK_TOPIC, payload, (err) => {
                const ackLog = document.getElementById(`ack-log-${cardId}`);
                if (err) {
                    ackLog.textContent = "Failed to send acknowledgement.";
                    return;
                }

                const now = new Date();
                ackLog.textContent = `Acknowledged - Sent: ${now.toLocaleString()}`;
                ackLog.classList.add("ack-sent");
                document.querySelector(`#${cardId} .ack-btn`).disabled = true;

                if (unacknowledgedAlertCount > 0) {
                    unacknowledgedAlertCount--;
                }
                if (unacknowledgedAlertCount === 0) {
                    stopAlarmLoop();
                }

                addHistoryEvent("sent", "Acknowledgment sent to MQTT broker");
            });
        }

        function addHistoryEvent(type, message) {
            if (historyCount === 0) {
                historyList.innerHTML = "";
            }

            const now = new Date();
            const timeStr = now.toLocaleString();
            const entry = document.createElement("div");
            entry.className = `history-entry history-${type}`;
            entry.textContent = `[${timeStr}] ${type.toUpperCase()}: ${message}`;
            historyList.insertBefore(entry, historyList.firstChild);

            historyCount++;
            if (historyCount > 50) {
                historyList.removeChild(historyList.lastChild);
                historyCount = 49;
            }
        }

        function setStatus(text) {
            brokerStatus = text;
            renderConnectionStatus();
            addHistoryEvent("connection", text);
        }

        function updateEsp32Status(newStatus) {
            esp32Status = newStatus;
            renderConnectionStatus();
        }

        function processIncomingAlert(message, source) {
            lastAlertMessage = message;
            addAlertCard(message);
            unacknowledgedAlertCount++;
            startAlarmLoop();
            addHistoryEvent("alert", `Bullying behavior alert received (${source})`);
        }

        function connectBroker() {
            const brokerUrl = DEFAULT_BROKER_URL;
            const username = DEFAULT_MQTT_USERNAME;
            const password = DEFAULT_MQTT_PASSWORD;

            setStatus("Connecting...");

            if (client) {
                client.end(true);
            }

            client = mqtt.connect(brokerUrl, {
                username,
                password,
                reconnectPeriod: 3000,
                clean: true,
                connectTimeout: 10000,
            });

            client.on("connect", () => {
                setStatus("connected");

                client.subscribe(ESP32_TOPIC, (err) => {
                    if (err) {
                        setStatus("Connected, but subscribe esp32 failed");
                    }
                });

                client.subscribe(ACK_TOPIC, (err) => {
                    if (err) {
                        addHistoryEvent("connection", "Failed to subscribe acknowledge topic");
                    }
                });

                client.subscribe(ESP32_STATUS_TOPIC, (err) => {
                    if (err) {
                        addHistoryEvent("connection", "Failed to subscribe esp32 status topic");
                    }
                });
            });

            client.on("message", (topic, payload) => {
                const message = payload.toString();

                if (topic === ESP32_TOPIC) {
                    processIncomingAlert(message, "mqtt");
                }

                if (topic === ESP32_STATUS_TOPIC) {
                    lastEsp32Seen = Date.now();
                    updateEsp32Status("Online");

                    try {
                        const statusData = JSON.parse(message);
                        if (statusData.status && typeof statusData.status === "string") {
                            const normalized = statusData.status.toLowerCase();
                            if (normalized === "online") {
                                updateEsp32Status("Online");
                            } else if (normalized === "offline") {
                                updateEsp32Status("Offline");
                            }
                        }
                    } catch (_err) {
                        // Ignore malformed status payloads and keep inferred status.
                    }
                }

                if (topic === ACK_TOPIC) {
                    addHistoryEvent("acknowledgement", "Alert acknowledged");
                }
            });

            client.on("reconnect", () => setStatus("Reconnecting..."));
            client.on("error", (err) => setStatus(`Error: ${err.message}`));
            client.on("close", () => {
                setStatus("Disconnected");
                updateEsp32Status("Unknown");
                stopAlarmLoop();
            });
        }

        connectBroker();
        renderConnectionStatus();

        // Many browsers require a user interaction before audio playback is allowed.
        window.addEventListener("pointerdown", unlockAudio, { once: true });
        window.addEventListener("keydown", unlockAudio, { once: true });

        setInterval(() => {
            if (!client || !client.connected) {
                return;
            }

            if (lastEsp32Seen === 0) {
                return;
            }

            if (Date.now() - lastEsp32Seen > ESP32_TIMEOUT_MS && esp32Status !== "Offline") {
                updateEsp32Status("Offline");
                addHistoryEvent("connection", "ESP32 heartbeat timeout - marked offline");
            }
        }, 5000);

        const { PushNotifications } = Capacitor.Plugins;

        function buildPushAlertMessage(notification) {
            const data = (notification && notification.data) || {};

            // Prefer full MQTT-like payload when available from FCM.
            if (data.mqtt_payload && typeof data.mqtt_payload === "string") {
                return data.mqtt_payload;
            }

            const payload = {};
            payload.message = data.message || notification.body || notification.title || "Push alert received";

            if (data.transcription) {
                payload.transcription = data.transcription;
            }

            if (data.analysis) {
                if (typeof data.analysis === "string") {
                    try {
                        payload.analysis = JSON.parse(data.analysis);
                    } catch (_err) {
                        payload.analysis = data.analysis;
                    }
                } else {
                    payload.analysis = data.analysis;
                }
            }

            return JSON.stringify(payload);
        }

        window.onload = async () => {

                const permission = await PushNotifications.requestPermissions();
                if (permission.receive === 'granted') {
                        await PushNotifications.register();

                        PushNotifications.addListener('registration', (token) => {
                                localStorage.setItem('playerId',token.value);
                                console.log(token.value);
                                addHistoryEvent("connection", "Push token registered");
                        });

                        //USING SYSTEM NOTIFICATION
                        PushNotifications.addListener('pushNotificationReceived', (notification) => {
                                const message = buildPushAlertMessage(notification);
                                        processIncomingAlert(message, "push");
                        });

                        // Handles notification tap from tray/background state.
                        PushNotifications.addListener('pushNotificationActionPerformed', (action) => {
                                const notification = action && action.notification ? action.notification : {};
                                const message = buildPushAlertMessage(notification);
                                processIncomingAlert(message, "push-tap");
                        });

                } else {
                        addHistoryEvent("connection", "Push notifications are disabled in phone settings.");
                }
        };


</script>
<script>
        document.addEventListener('gesturestart', function (e) {
                e.preventDefault();
        });
</script>
</body>
</html>
